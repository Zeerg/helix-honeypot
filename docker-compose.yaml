name: helix-honeypot

x-log-options: &log-options
  HELIX_LOG_FORMAT: ${HELIX_LOG_FORMAT-}
  HELIX_LOG_INCLUDE_USER_AGENT: ${HELIX_LOG_INCLUDE_USER_AGENT-}
  HELIX_LOG_TRUSTED_PROXY_CIDRS: ${HELIX_LOG_TRUSTED_PROXY_CIDRS-}

x-sensor: &sensor
  image: helix-honeypot:local
  init: true
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  pids_limit: 64
  mem_limit: 128m
  cpus: 0.50
  restart: unless-stopped
  networks:
    - honeynet

services:
  k8s:
    <<: *sensor
    build: .
    environment:
      <<: *log-options
      HELIX_RUN_MODE: k8s
      HELIX_K8S_HOST: 0.0.0.0
      HELIX_K8S_PORT: "8080"
      HELIX_K8S_API_VERSION: ${HELIX_K8S_API_VERSION-}
    ports:
      - "${HELIX_PUBLISH_HOST:-127.0.0.1}:${HELIX_K8S_PUBLISHED_PORT:-8080}:8080"

  http:
    <<: *sensor
    profiles: [all]
    environment:
      <<: *log-options
      HELIX_RUN_MODE: http
      HELIX_HTTP_HOST: 0.0.0.0
      HELIX_HTTP_PORT: "8081"
    ports:
      - "${HELIX_PUBLISH_HOST:-127.0.0.1}:${HELIX_HTTP_PUBLISHED_PORT:-8081}:8081"

  tcp:
    <<: *sensor
    profiles: [all]
    environment:
      <<: *log-options
      HELIX_RUN_MODE: tcp
      HELIX_TCP_HOST: 0.0.0.0
      HELIX_TCP_PORT: "9022"
    ports:
      - "${HELIX_PUBLISH_HOST:-127.0.0.1}:${HELIX_TCP_PUBLISHED_PORT:-9022}:9022"

  udp:
    <<: *sensor
    profiles: [all]
    environment:
      <<: *log-options
      HELIX_RUN_MODE: udp
      HELIX_UDP_HOST: 0.0.0.0
      HELIX_UDP_PORT: "9053"
    ports:
      - "${HELIX_PUBLISH_HOST:-127.0.0.1}:${HELIX_UDP_PUBLISHED_PORT:-9053}:9053/udp"

  kubelet:
    <<: *sensor
    profiles: [all]
    environment:
      <<: *log-options
      HELIX_RUN_MODE: kubelet
      HELIX_KUBELET_HOST: 0.0.0.0
      HELIX_KUBELET_PORT: "10250"
      HELIX_KUBELET_NODE_NAME: ${HELIX_KUBELET_NODE_NAME-}
    ports:
      - "${HELIX_PUBLISH_HOST:-127.0.0.1}:${HELIX_KUBELET_PUBLISHED_PORT:-10250}:10250"

networks:
  honeynet:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "false"
      com.docker.network.bridge.enable_icc: "false"
